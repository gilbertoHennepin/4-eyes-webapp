<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Eyes — Viewer</title>
    <meta name="description" content="View phone camera stream, analyze with AI, and hear responses.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css?v=2}" href="/css/style.css?v=2">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
</head>
<body>
    <div class="bg-animation"></div>

    <main class="app-page viewer-page">
        <!-- Header -->
        <header class="app-header glass-card">
            <div class="header-left">
                <a href="/" class="back-link">← Back</a>
                <h1 class="header-title gradient-text">🖥️ Viewer</h1>
            </div>
            <div class="header-right">
                <div class="room-badge">
                    <span class="badge-label">Room</span>
                    <span class="badge-code" id="roomDisplay" th:text="${room}">---</span>
                </div>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot"></span>
                    <span class="status-text" id="statusText">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Main Layout: Video + Response -->
        <div class="viewer-layout">
            <!-- Left: Video + Analyze Controls -->
            <div class="video-section">
                <div class="video-container glass-card animate-in">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-overlay" id="videoOverlay">
                        <div class="loading-spinner"></div>
                        <p>Waiting for camera stream...</p>
                    </div>
                    <canvas id="captureCanvas" style="display:none;"></canvas>
                </div>

                <div class="analyze-controls glass-card">
                    <div class="analyze-row">
                        <button id="btnAnalyze" class="btn btn-primary btn-large" disabled>
                            <span class="btn-icon-left">🧠</span>
                            Analyze
                        </button>
                        <div class="auto-analyze">
                            <label class="toggle-label">
                                <input type="checkbox" id="autoAnalyze">
                                <span class="toggle-slider"></span>
                                Auto
                            </label>
                            <select id="autoInterval" class="select-small">
                                <option value="5000">5s</option>
                                <option value="10000" selected>10s</option>
                                <option value="30000">30s</option>
                                <option value="60000">60s</option>
                            </select>
                        </div>
                    </div>
                    <div class="prompt-row">
                        <input type="text" id="customPrompt"
                               placeholder="Custom prompt (optional)... e.g. 'Solve this equation'"
                               class="prompt-input">
                    </div>
                </div>
            </div>

            <!-- Right: AI Response Panel -->
            <div class="response-section">
                <div class="response-panel glass-card">
                    <div class="response-header">
                        <h2>🔊 AI Response</h2>
                        <div class="tts-controls">
                            <label class="toggle-label">
                                <input type="checkbox" id="autoSpeak" checked>
                                <span class="toggle-slider"></span>
                                Auto-speak
                            </label>
                            <button id="btnSpeak" class="btn btn-icon-small" title="Speak last response" disabled>
                                🔊
                            </button>
                            <button id="btnStopSpeak" class="btn btn-icon-small" title="Stop speaking">
                                ⏹️
                            </button>
                        </div>
                    </div>
                    <div class="response-body" id="responseBody">
                        <div class="empty-state">
                            <p class="empty-icon">💬</p>
                            <p>Click <strong>Analyze</strong> to send the current frame to AI</p>
                            <p class="empty-hint">The AI will analyze what the camera sees and respond</p>
                        </div>
                    </div>
                    <div class="response-history" id="responseHistory">
                        <!-- Previous responses listed here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        const ROOM_ID = [[${room}]];
        const ROLE = 'viewer';
    </script>
    <script th:src="@{/js/app.js?v=3}" src="/js/app.js?v=3"></script>
</body>
</html>
